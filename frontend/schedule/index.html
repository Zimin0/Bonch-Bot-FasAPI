<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование ПК</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script type="module" src="script.js" defer></script>
    <script>
        function toggleSessions() {
            var x = document.getElementById("sessions-table");
            if (x.style.display === "none") {
                x.style.display = "table";
            } else {
                x.style.display = "none";
            }
        }
    </script>
</head>
<body onload="User.update_user_info();">
    <div class="menu">
        <a href="/">Главная</a>
        <a href="/frontend/settings">Админ панель</a>
        <a href="/frontend/auth/login">Вход</a>
        <a href="/frontend/auth/register">Регистрация</a>
        <a href="/logout" id="logout_button">Выйти</a>
        <a href="/frontend/schedule/">Бронирование</a>
        <a href="/frontend/profile/">Профиль</a>
        <span id="username" style="float:right; color:white; padding: 14px 16px;"></span>
    </div>

    <h1>Бронирование ПК</h1>

    <div class="form-group">
        <label for="pc-select">Выберите ПК:</label>
        <select id="pc-select" class="styled-select">
            <!-- Options will be populated dynamically -->
        </select>
    </div>

    <div class="form-group">
        <label for="start-time">Время начала:</label>
        <select id="start-time" class="styled-select">
            <!-- Options for start time -->
        </select>
        
        <label for="end-time">Время конца:</label>
        <select id="end-time" class="styled-select">
            <!-- Options for end time -->
        </select>
    </div>

    <button class="styled-button" onclick="bookSession()">Забронировать</button>
    <button class="styled-button" onclick="toggleSessions()">Мои сессии</button>

    <table id="sessions-table" style="display:none;">
        <thead>
            <tr>
                <th>Номер</th>
                <th>ПК</th>
                <th>Время начала</th>
                <th>Время конца</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="sessions-body">
            <!-- User sessions will be populated here -->
        </tbody>
    </table>

    <div id="pc-containers"></div>
    <div id="message-container"></div>
</body>
</html>
