<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Time Periods</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body onload="User.update_user_info();">

    <div class="menu">
        <a href="/">Главная</a>
        <a href="/frontend/settings">Админ панель</a>
        <a href="/frontend/auth/login">Вход</a>
        <a href="/frontend/auth/register">Регистрация</a>
        <a href="/logout" id="logout_button">Выйти</a>
        <a href="/frontend/schedule/">Бронирование</a>
        <a href="/frontend/profile/">Профиль</a>
        <span id="username" style="float:right; color:white; padding: 14px 16px;"></span>
    </div>

    <h1>Панель администратора</h1>

    <div class="submenu">
        <a href="/frontend/time_periods/">Создание временных промежутков</a>
        <a href="/frontend/settings/">Управление настройками</a>
    </div>

    <div class="container">
        <h1>Create Time Periods</h1>

        <div class="form-group" id="time-selection">
            <label for="start-time">Start Time:</label>
            <input type="time" id="start-time" name="start-time" value="10:00">
        </div>

        <div class="form-group" id="time-selection">
            <label for="end-time">End Time:</label>
            <input type="time" id="end-time" name="end-time" value="21:00">
        </div>

        <div class="form-group" id="time-selection">
            <label for="start-time">Time interval (minutes):</label>
            <input type="time" id="interval-time" name="interval-time" value="00:15">
        </div>

        <div class="form-group">
            <label for="use-db-settings">
                <input type="checkbox" id="use-db-settings" name="use-db-settings">
                Использовать настройки из базы данных
            </label>
        </div>

        <div class="form-group">
            <button id="create-time-periods">Create Time Periods</button>
        </div>

        <div id="message-container"></div>
    </div>
</body>
</html>
